name: Feature Request
description: Suggest an idea for tenor
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a new feature! Please fill out the sections below.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve? What use case is not currently addressed?
      placeholder: "Currently, there's no way to..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How should this feature work? Describe the ideal behavior.
      placeholder: "Add a new config option `video.new_option` that..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other approaches did you consider? Why is this the best?
      placeholder: "Could also be done via CLI flag, but config is more consistent..."
    validations:
      required: false

  - type: textarea
    id: api-impact
    attributes:
      label: Config / API Impact
      description: Does this change config.yaml, CLI flags, or public Python APIs? Any breaking changes?
      placeholder: "New config key: `video.new_option` (default: false). No breaking changes."
      render: markdown
    validations:
      required: true

  - type: textarea
    id: implementation
    attributes:
      label: Implementation Ideas
      description: Any thoughts on how to implement this? Which modules would be affected?
      placeholder: "Would need changes in pipeline.py (export) and styling.py (grading)..."
      render: markdown
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues/PRs for similar requests
          required: true
        - label: This feature aligns with tenor's scope (automated Reels/Shorts pipeline)
          required: true