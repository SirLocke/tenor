name: Question / Support
description: Ask a question or get help with tenor
title: "[Question]: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Have a question about tenor? We're happy to help!

        Before asking, please check:
        - [README.md](https://github.com/SirLocke/tenor/blob/main/README.md)
        - [Existing issues](https://github.com/SirLocke/tenor/issues)
        - [Discussions](https://github.com/SirLocke/tenor/discussions) (if enabled)

  - type: textarea
    id: question
    attributes:
      label: Your Question
      description: What do you need help with?
      placeholder: "How do I configure the quality gate for low-light clips?"
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: What are you trying to achieve? Share relevant config, logs, or setup details.
      placeholder: |
        I'm running tenor on a Raspberry Pi 4 with clips from...
      render: markdown
    validations:
      required: false