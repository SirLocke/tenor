name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, Test & Functional Pipeline Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Dependencies (ffmpeg & libsndfile)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python Syntax & Lint Check
        run: |
          python -m py_compile src/*.py
          ruff check --select=E9,F63,F7,F82 src tests

      - name: Run Pytest Suite
        run: |
          pytest tests -v --tb=short

      - name: Functional Pipeline Smoke Test
        run: |
          # Synthesize a realistic 3s vertical 1080x1920 test clip
          ffmpeg -y -f lavfi -i testsrc=duration=3:size=1080x1920:rate=30 \
                    -f lavfi -i sine=frequency=1000:duration=3 \
                    -c:v libx264 -c:a aac -pix_fmt yuv420p /tmp/tenor_smoke.mov
          
          # Run pipeline dry-run and verify valid JSON output
          python -m src.pipeline -i /tmp/tenor_smoke.mov --dry-run --json > /tmp/plan.json
          cat /tmp/plan.json
          
          # Assert cut plan was generated
          python -c '
          import json
          with open("/tmp/plan.json") as f:
              data = json.load(f)
          assert data.get("cuts", 0) > 0, "No cuts generated in smoke test!"
          print(f"✅ Functional pipeline smoke test passed: {data.get(\"cuts\")} cuts, {data.get(\"duration\")}s duration")
          '
          
          rm -f /tmp/tenor_smoke.mov /tmp/plan.json
