# =============================================================================
# tenor - Konfiguration
# Alle Pfade dürfen relative Pfade, ~ oder ${VARIABLE} enthalten.
# Überschreibbar per CLI (-c/--config) oder Env (TENOR_*).
# =============================================================================

# Ingest: Hier landen die Rohclips (iPhone MOV/MP4). Wird vom Watcher überwacht.
ingest_dir: ~/video-cut/ingest
# Export: fertige Reels/Shorts + Cover-Thumbnails, unterteilt nach <Trip>/<Tag>/
output_dir: ~/video-cut/output
# Musik: MP3s fuer Beat-Matching. Die neueste Datei liefert nur den Takt; als
# Ton ins Reel kommt Musik nur, wenn sie bewusst gewaehlt wurde (-m <datei>,
# Homelab-Auswahl oder -m auto auf music.file unten).
music_dir: ~/video-cut/music

# Als Rohmaterial akzeptierte Endungen (case-insensitiv geprüft).
# HEVC: iPhone liefert H.265 als .MOV/.MP4, teils auch als Rohbitstream.
extensions:
  - .mov
  - .mp4
  - .m4v
  - .hevc
  - .h265

# =============================================================================
# Video-Export
# =============================================================================
video:
  width: 1080          # 9:16
  height: 1920
  fps: 30
  codec: libx264
  crf: 19              # 18 = visuell verlustfrei, 23 = klein. 19 = sweet spot
  preset: medium       # ultrafast..veryslow
  pixel_format: yuv420p
  # Audio ist ein Opt-in. Mit false (Default) bleibt das Reel ohne Originalton.
  # Mit true wandert der Ton der Rohclips ins Reel - und liegt Musik darunter,
  # laeuft der Originalton gedämpft darunter. Musik wird nur bei bewusster Wahl
  # untergemischt (-m <datei>, Homelab-Auswahl oder -m auto); der
  # Watcher-Automatismus (neueste Datei aus music_dir, spotify.track_file)
  # steuert nur den Schnitttakt.
  # Auch nachtraeglich per CLI: --audio / --no-audio
  audio: false
  # Tonpegel des Clip-Originaltons, wenn Musik darunter gemischt wird.
  original_gain: 0.25
  audio_codec: aac          # AAC - von Instagram/WhatsApp akzeptiert
  audio_bitrate: 192k
  audio_sample_rate: 44100   # 48000 bei filmischem Material
  audio_nbytes: 2            # 2 = 16 bit (Ausgangsqualitaet)
  faststart: true      # -movflags +faststart
  max_duration: 0      # Reel hart auf X Sekunden kürzen (0 = unlimited)
  cover: true          # 1080x1920 Thumbnail erzeugen
  cover_at: 0.5        # Zeitpunkt des Cover-Frames in Sekunden
  threads: 0           # 0 = ffmpeg entscheidet selbst

# =============================================================================
# Musik im fertigen Reel
# -----------------------------------------------------------------------------
# Wichtig: Musik wird NUR untergemischt, wenn sie bewusst als *Ton* gewaehlt
# wurde - per `-m <datei>` (auch aus dem Homelab) oder per `-m auto`, das auf
# `file` bzw. TENOR_MUSIC_FILE zeigt. Ein Lauf *ohne* `-m` bleibt stumm: der
# Watcher-Automatismus (neueste Datei aus music_dir, spotify.track_file) liefert
# nur den Takt fuer den Schnittplan. Das ist Absicht - niemand hat in einem
# unbeaufsichtigten Lauf nach Musik gefragt.
#
# Ist die Datei leer, fehlt oder unlesbar, bleibt der Export stumm - ein
# kaputter Track darf nie das ganze Video kosten.
# =============================================================================
music:
  # Feste Musikdatei fuer `-m auto` (bzw. TENOR_MUSIC_FILE). Leer = bei `-m
  # auto` wird nichts gemischt.
  #   file: ~/video-cut/music/the_waves.mp3
  file: ""
  gain: 1.0            # Pegel der Musik (1.0 = unveraendert)
  fade_in: 0.0         # Einblenden am Reel-Anfang, Sekunden (0 = hart)
  fade_out: 1.5        # Ausblenden am Reel-Ende, Sekunden
  # Kuerzere Tracks werden in Schleifen bis ueber die Reellaenge gelegt und dann
  # auf die exakte Laenge geschnitten - ein 90-Sekunden-Track auf einem
  # 3-Sekunden-Reel darf nicht nach 1,5 s verstummen.

# =============================================================================
# Schnitt / Beat-Matching
# =============================================================================
cut:
  target_min: 1.4      # kürzester Cut (Sekunden)
  target_max: 2.0      # längster Cut (Sekunden)
  target: 1.7          # Wunsch-Cutlänge, bestimmt Beat-Gruppierung
  # Ohne Musik/Spotify wird ein künstliches Beat-Grid aus fallback_bpm gebaut:
  # Beats = 60/fallback_bpm, gruppiert auf ~target. 120 BPM -> 0,5s Beats,
  # Gruppe 3 -> 1,5s Cuts (passt in target_min..target_max).
  fallback_bpm: 120
  # fallback_interval ist nur der Notfall-Takt, wenn weder BPM noch Musik
  # verwertbar sind (z. B. fallback_bpm: 0).
  fallback_interval: 1.8
  max_cuts: 0          # 0 = unlimited, sonst harte Obergrenze pro Reel
  max_per_clip: 0      # 0 = unlimited, sonst max. Cuts aus derselben Datei

# =============================================================================
# Text-Overlay
# =============================================================================
# Auf wie vielen der ersten Cuts steht der Text? Instagram-Reels-Konvention:
# der Hook trägt die Beschriftung, der Rest bleibt clean, damit der Blick
# auf das Bild fällt. 0 = Text auf allen Cuts.
text_on_first_cuts: 2

# =============================================================================
# Bildqualitäts-Gate für die Cut-Auswahl
# -----------------------------------------------------------------------------
# Ohne diese Prüfung landen im Reel genauso schwarze Frames, verwackelte
# Schwenks und - bei iPhone-Bursts - dieselben Momente mehrfach. Vor dem
# Rendern wird pro Rohclip ein Graustufen-Strip gezogen (ein ffmpeg-Durchlauf,
# Ergebnis zwischengespeichert) und jedes geplante Cut-Fenster damit bewertet.
# Durchgefallene Fenster werden verschoben, echte Wiederholungen verworfen.
#
# Die Zahlenwerte sind an echten 4K-iPhone-Clips ausgemessen, nicht geraten:
# Schärfe (Laplacian-Varianz) liegt dort bei 3 300-35 000, Luma bei 99-187.
# Die Grenzen stehen bewusst weit daneben, damit gutes Material nie durchfällt.
# quality.enabled: false schaltet das Gate vollständig ab.
# =============================================================================
quality:
  enabled: true
  sample_fps: 4.0        # Abtastrate des Strips (Frames/Sekunde)
  edge_trim: 0.25        # erste/letzte Viertelsekunde eines Clips aussparen
  # Lokale Kriterien. Untergrenzen mit 0 sind aus; bei max_luma/max_*_ratio
  # ist der ausgeschaltete Wert 255 bzw. 1.0.
  min_sharpness: 2500    # Laplacian-Varianz; fängt unscharfe Frames
  min_luma: 35           # schwarze Frames (wird VOR dem Grading gemessen)
  max_luma: 242          # ausgebrannte Himmel
  max_black_ratio: 0.35  # Anteil reiner Schwarz-Pixel
  max_white_ratio: 0.25  # ausgefressene Flächen
  # Mittlere absolute Differenz zweier 16x16-Bildsignaturen. An der echten
  # Schnittplanung der Madeira-Clips gemessen (15 Cuts, Vergleich gegen die
  # drei vorherigen):
  #   gleicher Moment, andere Datei (iPhone-Burst)   6,8 - 13,9
  #   zwei Cuts aus demselben statischen Clip        7,4 -  8,0
  #   verschiedene Clips / verschiedene Szenen      24,7 - 104,6
  # Beide unteren Gruppen sind echte Wiederholungen, 20 liegt in der Lücke.
  # 0 schaltet die Wiederholungsprüfung ab.
  duplicate_threshold: 20
  # Gegen wie viele zuletzt gezeigte Cuts verglichen wird. 1 erkennt nur
  # direkte Nachbarschaft, 3 auch das A-B-A-Muster.
  duplicate_memory: 3
  # Sekunden, um die ein durchgefallenes Fenster verschoben wird (Reihenfolge).
  search_offsets: [0.3, -0.3, 0.6, -0.6, 0.9, -0.9]
  # Was passiert, wenn auch alle Varianten durchfallen:
  drop_duplicates: true  # echte Wiederholung verwerfen
  keep_imperfect: true   # unsauberes Bild behalten (weiches Bild schlägt Lücke)
  cache_dir: ~/video-cut/.cache/quality

# =============================================================================
# Color Grading ("Natürlicher, dezenter Look")
# Presets: natural (dezent & natürlich), original (kein Filter), cinematic (Dark-Film)
# =============================================================================
style:
  preset: natural          # Standard: dezent & natürlich (lebendige Farben, tiefe Schwarztöne)
  gamma: 1.0               # 1.0 = natürliche neutrale Belichtung
  contrast: 0.02           # minimaler natürlicher Mikrokontrast
  black_lift: 0.0          # 0.0 = echte, tiefe Schwarztöne (kein milchiger Schleier)
  black_toe: 1.0           # Auslaufkurve
  highlight_ceiling: 1.0   # 1.0 = keine Lichter-Kompression (reines Weiß bleibt weiß)
  saturation: 1.03         # natürliche, frische iPhone-Farben
  shadow_desaturate: 0.0   # Schattenfarbe nicht entsättigen
  teal_red: 0.0            # keine Farbverfälschung
  teal_green: 0.0
  teal_blue: 0.0
  highlight_cool: 0.0
  skin_damp: 0.0
  text:
    anchor_x: 900          # 1080 - 180 => rechter Ankerpunkt (Safe Zone)
    y_title: 1445          # Textgruppe zwischen 1440 und 1540 px
    max_width: 780         # Textbreite links vom Ankerpunkt
    title_size: 36         # Roboto-Bold, Versalien
    subtitle_size: 24      # Roboto-Regular/Mono, #D0D5DD
    geo_size: 16           # Roboto-Mono, #9CA3AF
    title_tracking: 3      # Letter-Spacing in px
    subtitle_tracking: 1
    geo_tracking: 2
    line_gap: 16
    title_color: "#FFFFFF"
    subtitle_color: "#D0D5DD"
    geo_color: "#9CA3AF"
    uppercase_title: true
    safe_bottom: 1540      # Textgruppe wandert nach oben, wenn sie überragt
    shadow_offset: [2, 2]
    shadow_blur: 4
    shadow_alpha: 0.7      # 70% Deckkraft des Drop-Shadows

# =============================================================================
# Fonts (Roboto bevorzugt, Fallback auf Systemfonts)
# =============================================================================
fonts:
  bold: assets/fonts/Roboto-Bold.ttf
  regular: assets/fonts/Roboto-Regular.ttf
  mono: assets/fonts/RobotoMono-Regular.ttf
  auto_download: true      # fehlen die TTFs, einmalig nach assets/fonts holen
  system_fallbacks:
    - /usr/share/fonts/truetype/roboto/unhinted/Roboto-Bold.ttf
    - /usr/share/fonts/truetype/lato/Lato-Bold.ttf
    - /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
    - /usr/share/fonts/truetype/noto/NotoSans-Bold.ttf
    - /usr/share/fonts/truetype/liberation/LiberationSans-Bold.ttf

# =============================================================================
# Metadaten / Geocoding
# =============================================================================
metadata:
  # Erlaubte Abweichung in Sekunden für Metadaten-Zeitstempel in der Zukunft.
  # Hilft dabei, far-future Datumsangaben abzufangen (z.B. falsche Uhreinstellung)
  future_tolerance: 86400

geocoding:
  enabled: true
  timeout: 5               # Sekunden (Plan-Vorgabe)
  zoom: 10
  language: de
  user_agent: "tenor/1.0 (self-hosted video pipeline; +https://github.com/SirLocke/tenor)"
  cache_file: ~/video-cut/.cache/geocoding.json
  cache_precision: 3       # Nachkommastellen für Cache-Key (~$100m)

# =============================================================================
# Watcher
# =============================================================================
watcher:
  debounce_seconds: 5      # Dateigröße muss so lange stabil sein
  batch_window: 12         # nach dem ersten Clip X Sekunden weiter sammeln
  max_queue_size: 0        # 0 = unbegrenzt, sonst Backpressure, wenn zu viele Dateien auf Verarbeitung warten
  # true = Ingest-Unterordner mitüberwachen. Der Ordnername wird dann als
  # Tripname für den Output verwendet (ingest/Madeira 2026/ -> output/Madeira 2026/).
  recursive: true
  # Verzeichnisnamen, die komplett ignoriert werden (nicht durchlaufen)
  ignore_dirs: ["imgest"]
  process_existing_on_start: true   # beim Start bereits liegende Clips einlesen
  delete_after: false      # Rohclips nach erfolgreichem Export löschen
  min_clip_duration: 0.6   # kürzere Dateien überspringen
  # Ein fehlgeschlagener Batch bleibt liegen und wird erneut versucht - sonst
  # ginge das Material bei einem transienten Fehler (ffmpeg-OOM, NAS-Aussetzer)
  # bis zum nächsten Neustart verloren.
  retry_limit: 3           # Versuche pro Datei, danach aufgeben
  retry_backoff: 300       # Sekunden Wartezeit zwischen den Versuchen

# =============================================================================
# Nextcloud Auto-Scan (optional)
# Nach jedem Export: Nextcloud dazu bringen, neue Dateien zu indizieren.
# Standard: deaktiviert. Für Docker (Benutzer/Pfad anpassen):
#   scan_cmd: "docker exec nextcloud occ files:scan <user> --path=/Reels"
# Für lokale Instanz:
#   scan_cmd: "occ files:scan <user> --path=/data/<user>/files/Reels"
# =============================================================================
nextcloud:
  enabled: false
  # Beispiel (docker exec in den Nextcloud-Container); für den eigenen Aufbau
  # anpassen oder in config.local.yaml überschreiben.
  scan_cmd: 'docker exec nextcloud php /var/www/html/occ files:scan <user> --path="/Reels"'
  timeout: 60

# =============================================================================
# Spotify Beat Detection (optional)
# Nutzt Spotify Web API Audio Analysis für präzise Beat-Timestamps.
# Benötigt SPOTIFY_CLIENT_ID + SPOTIFY_CLIENT_SECRET als Env-Vars.
# =============================================================================
spotify:
  enabled: false
  # Verzeichnis, in dem die Spotify-Beats zwischengespeichert werden.
  cache_dir: ".cache/spotify_beats"
  # Gültigkeitsdauer des Caches in Sekunden (7 Tage).
  cache_ttl: 604800
  # Track, an dessen Beats geschnitten wird. URI oder URL, z. B.
  #   track_uri: "spotify:track:4cOdK2wGLETKBW3PvgPWqT"
  # Alternativ auf der CLI: python -m src.pipeline -m "spotify:track:<ID>"
  track_uri: ""

  # ACHTUNG (Stand 2026): Spotify beantwortet /v1/audio-analysis für jede App,
  # die nach dem 27.11.2024 registriert wurde, dauerhaft mit HTTP 403. Ohne
  # genehmigte "Extended Quota" kommt damit kein einziger Beat an - die
  # Auswahl bliebe stumm und es würde auf den BPM-Fallback zurückfallen.
  # track_file ist der Ausweg: die AUDIO des gewählten Tracks als lokale Datei.
  # librosa gewinnt daraus dieselben Beat-Zeitpunkte, ganz ohne API.
  #   track_file: ~/video-cut/music/the_waves.mp3
  # Ist die Datei nicht lesbar, greift als naechstes die neueste Datei aus
  # music_dir und danach der BPM-Fallback.
  #
  # Ohne die Datei im Repo zu aendern, per Env-Variable festnageln (geht auch
  # ueber die systemd-Unit, siehe spotify.env):
  #   TENOR_SPOTIFY_TRACK_FILE=~/video-cut/music/the_waves.mp3
  track_file: ""

  # Wird nur benutzt, wenn weder Spotify noch eine MP3 im music_dir vorliegt.
  default_bpm: 120
  # Zuordnung Name/Schlüsselwort -> BPM. Der Schlüssel "default" gewinnt, wenn
  # nichts spezieller passt - ohne ihn wäre die YAML-Reihenfolge entscheidend.
  # Ein Treffer über den Musik-Namen gewinnt vor "default".
  fallback_bpm:
    "default": 120
    "pop": 120
    "edm": 128
    "hiphop": 90
    "rock": 110
    "reggae": 80
    "house": 124
    "techno": 132

naming:
  # Dateiname innerhalb des Zielordners
  template: "{date}_{slug}_{time}"   # date=JJJJ-MM-TT, slug=Titel, time=HHMMSS
  # Unterordner-Struktur: {trip}=Tripname, {day}=Aufnahmetag aus den Metadaten
  # Leerer Wert "" schreibt direkt in output_dir ohne Unterordner.
  folder_template: "{trip}/{day}"
  extension: .mp4

logging:
  level: INFO
  file: ~/video-cut/.cache/tenor.log
